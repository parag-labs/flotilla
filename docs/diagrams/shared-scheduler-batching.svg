<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="660" viewBox="0 0 1560 660" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1560" height="660" fill="#fbfcfe"/><text x="780.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">flotilla - shared scheduler &amp; RPC batching</text><text x="780.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">One scheduler per node drives thousands of groups in a single pass, and every message to the same peer is coalesced into one envelope.</text><rect x="50" y="158" width="520" height="300" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#4285f4" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="149" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#17509f">NODE A</text><rect x="74" y="196" width="472" height="87" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(90,211) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></g><text x="120" y="227" font-size="16.5" font-weight="700" fill="#17509f">Scheduler (node A)</text><text x="91" y="249.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">owns every local replica; one pass/tick</text><text x="91" y="266.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">add_group is a dict insert, no thread</text><rect x="74" y="340" width="200" height="87" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(90,355) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></g><text x="120" y="371" font-size="16.5" font-weight="700" fill="#552fae">Group replicas</text><text x="91" y="393.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">each: group_id, peers</text><text x="91" y="410.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">leader = min(peers)</text><rect x="346" y="340" width="200" height="87" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(362,355) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v5a5 5 0 0 0 5 5h7"/><path d="M6 21v-5a5 5 0 0 1 5-5"/><path d="M15 10l3 3-3 3"/></g><text x="392" y="371" font-size="16.5" font-weight="700" fill="#9e2b36">_batch()</text><text x="363" y="393.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">group outbound by dst</text><text x="363" y="410.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">msgs += n, envs += peers</text><path d="M200,285 L200,337" stroke="#8494ab" stroke-width="2.0" fill="none" marker-end="url(#ah-slate)"/><rect x="169.912" y="299.0" width="60.176" height="24.0" rx="12" fill="#ffffff" stroke="#8494ab" stroke-opacity="0.4"/><text x="200.0" y="315.44" text-anchor="middle" font-size="12" font-weight="600" fill="#3d4a63">drives</text><path d="M274,383 L344,383" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="280.424" y="371.0" width="57.152" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="309.0" y="387.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">by dst</text><rect x="660" y="332" width="240" height="104" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(676,347) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></g><text x="706" y="363" font-size="16.5" font-weight="700" fill="#136b74">Envelope</text><text x="677" y="385.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">one per destination peer</text><text x="677" y="402.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">inner msgs keep their group</text><text x="677" y="420.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">wire cost &lt;= peer pairs</text><path d="M546,383 L658,383" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="574.112" y="371.0" width="81.77600000000001" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="615" y="387.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">coalesced</text><path d="M900,383 L1012,383" stroke="#2aa5b0" stroke-width="2.0" fill="none" marker-end="url(#ah-cyan)"/><rect x="911.312" y="371.0" width="67.376" height="24.0" rx="12" fill="#ffffff" stroke="#2aa5b0" stroke-opacity="0.4"/><text x="945" y="387.44" text-anchor="middle" font-size="12" font-weight="600" fill="#136b74">one RPC</text><rect x="990" y="158" width="520" height="300" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#4285f4" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="1008" y="149" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#17509f">NODE B</text><rect x="1014" y="196" width="472" height="87" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1030,211) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></g><text x="1060" y="227" font-size="16.5" font-weight="700" fill="#17509f">Scheduler (node B)</text><text x="1031" y="249.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">owns node B's replicas the same way</text><text x="1031" y="266.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">receives, drives, re-batches - no thread</text><rect x="1014" y="340" width="200" height="87" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1030,355) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v4a4 4 0 0 0 4 4h8"/><path d="M6 21v-4a4 4 0 0 1 4-4h8"/><path d="M15 8l3 3-3 3"/><path d="M15 14l3 3-3 3"/></g><text x="1060" y="371" font-size="16.5" font-weight="700" fill="#136b74">deliver()</text><text x="1031" y="393.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">unpack, fan by group</text><text x="1031" y="410.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">re-batch any replies</text><rect x="1286" y="340" width="200" height="87" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1302,355) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></g><text x="1332" y="371" font-size="16.5" font-weight="700" fill="#552fae">Group replicas</text><text x="1303" y="393.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">handle: adopt leader</text><text x="1303" y="410.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">if term &gt;= own term</text><path d="M1134,285 L1134,337" stroke="#8494ab" stroke-width="2.0" fill="none" marker-end="url(#ah-slate)"/><rect x="1103.912" y="299.0" width="60.176" height="24.0" rx="12" fill="#ffffff" stroke="#8494ab" stroke-opacity="0.4"/><text x="1134.0" y="315.44" text-anchor="middle" font-size="12" font-weight="600" fill="#3d4a63">drives</text><path d="M1214,383 L1284,383" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="1218.336" y="371.0" width="61.327999999999996" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="1249.0" y="387.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">fan out</text><rect x="50" y="492" width="473" height="95.19999999999999" rx="11" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.4" stroke-opacity="0.8"/><text x="66" y="516" font-size="13.2" font-weight="700" fill="#8c5a0d">Wire cost tracks peer pairs, not groups</text><text x="66" y="538" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">2,000 groups on 3 nodes: thousands of logical</text><text x="66" y="556.4" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">messages, yet total_envelopes() stays &lt;= 6.</text><text x="66" y="574.8" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">Envelope count scales with peer pairs only.</text><rect x="543" y="492" width="473" height="95.19999999999999" rx="11" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.4" stroke-opacity="0.8"/><text x="559" y="516" font-size="13.2" font-weight="700" fill="#552fae">Leader = min(id) compared as a string</text><text x="559" y="538" font-size="12.4" fill="#552fae" fill-opacity="0.92">Election is a stand-in: the leader is min(peers)</text><text x="559" y="556.4" font-size="12.4" fill="#552fae" fill-opacity="0.92">compared as strings, so 'n10' sorts before 'n2'.</text><text x="559" y="574.8" font-size="12.4" fill="#552fae" fill-opacity="0.92">Every language port has a test pinning this.</text><rect x="1036" y="492" width="473" height="95.19999999999999" rx="11" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.4" stroke-opacity="0.8"/><text x="1052" y="516" font-size="13.2" font-weight="700" fill="#17509f">The scheduler owns the groups</text><text x="1052" y="538" font-size="12.4" fill="#17509f" fill-opacity="0.92">Real consensus - elections, log, commit rule -</text><text x="1052" y="556.4" font-size="12.4" fill="#17509f" fill-opacity="0.92">is coracle's job; here leader logic is trivial.</text><text x="1052" y="574.8" font-size="12.4" fill="#17509f" fill-opacity="0.92">Swap the replica and the scheduler is unchanged.</text><text x="780.0" y="642" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/flotilla</text></svg>